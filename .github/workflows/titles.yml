# 每天自动翻译推荐频道的节目标题，结果写入 titles.json（GitHub Pages 会自动发布）
# 需要在仓库 Settings → Secrets and variables → Actions 里添加 DEEPL_API_KEY
name: Translate episode titles

on:
  schedule:
    - cron: '0 22 * * *' # 每天 UTC 22:00 = 北京时间早上 6:00
  workflow_dispatch: # 也可以在 Actions 页面手动运行

permissions:
  contents: write

concurrency:
  group: titles
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock opencc-js@1.0.5
      - run: node tools/translate-titles.mjs
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
      - name: Commit titles.json
        run: |
          if git status --porcelain titles.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add titles.json
            git commit -m "Update episode title translations"
            git push
          else
            echo "没有变化"
          fi
